name: PR
on:
  pull_request:
  push: { branches: [main, master] }
concurrency: { group: "pr-${{ github.ref }}", cancel-in-progress: true }

# GitHub Actions can compile/verify iOS + tvOS *Simulator* builds in the cloud
# (CODE_SIGNING_ALLOWED=NO). A device-installable signed IPA for Apple TV still
# needs Apple Developer certs/profiles (or local Xcode + atvloadly).
env:
  SMARTTUBE_DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not present; using default $(xcode-select -p)"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
      - name: Install tools
        run: brew install just swiftlint
      - name: Placeholder secrets (fork-safe)
        run: cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            SmartTubeIOS/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
      - name: Docs sanity
        run: |
          test $(wc -l < AGENTS.md) -le 200
          head -1 CLAUDE.md | grep -q '^@AGENTS.md$'
          scripts/check-doc-links.sh
      - name: Gate
        run: just ci

  # Independent of `just ci` so a package-test compile break cannot hide a
  # tvOS Simulator build failure (or success). This is the cloud compile proof.
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not present; using default $(xcode-select -p)"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
          echo "Available iPhone / Apple TV simulators:"
          xcrun simctl list devices available | grep -E "iPhone 17|Apple TV" || true
      - name: Install tools
        run: brew install just
      - name: Placeholder secrets (fork-safe)
        run: cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            SmartTubeIOS/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-compile-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build iOS Simulator
        run: just build
      - name: Build tvOS Simulator
        run: just build-tvos
