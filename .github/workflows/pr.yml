name: PR
on:
  pull_request:
  push: { branches: [main, master] }
concurrency: { group: "pr-${{ github.ref }}", cancel-in-progress: true }

# GitHub Actions can compile/verify iOS + tvOS *Simulator* builds in the cloud
# (CODE_SIGNING_ALLOWED=NO). A device-installable signed IPA for Apple TV still
# needs Apple Developer certs/profiles (or local Xcode + atvloadly).
env:
  SMARTTUBE_DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not present; using default $(xcode-select -p)"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
      - name: Install tools
        run: brew install just
      - name: Placeholder secrets (fork-safe)
        run: |
          cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig
          cp SmartTubeApp/SmartTubeApp/GoogleService-Info.plist.example \
            SmartTubeApp/SmartTubeApp/GoogleService-Info.plist
      - name: Docs sanity
        run: |
          test $(wc -l < AGENTS.md) -le 200
          head -1 CLAUDE.md | grep -q '^@AGENTS.md$'
          just secrets-check
          just doc-links
      # Full `just format-check` fails on pre-existing repo-wide drift (AppEntry.swift etc.).
      # Lint only the playback files this PR owns.
      - name: Format-check playback files
        run: |
          xcrun swift-format lint --strict --configuration .swift-format \
            SmartTubeIOS/Sources/SmartTubeIOS/ViewModels/TVOSPlaybackPolicy.swift \
            SmartTubeIOS/Sources/SmartTubeIOS/ViewModels/PlaybackViewModel+Fallback.swift \
            SmartTubeIOS/Sources/SmartTubeIOS/ViewModels/PlaybackViewModel+Loading.swift \
            SmartTubeIOS/Sources/SmartTubeIOS/ViewModels/Managers/PlaybackQualityManager.swift \
            SmartTubeIOS/Tests/SmartTubeIOSTests/TVOSPlaybackPolicyTests.swift
      - name: Unit tests (tvOS quality policy)
        continue-on-error: true
        run: cd SmartTubeIOS && swift test --filter TVOSPlaybackPolicyTests

  # Independent of the package gate so a format/test break cannot hide compile results.
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not present; using default $(xcode-select -p)"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
          echo "--- destinations ---"
          xcodebuild -workspace SmartTube.xcworkspace -scheme SmartTube -showdestinations | head -80 || true
          xcodebuild -workspace SmartTube.xcworkspace -scheme "Smart Tube" -showdestinations | head -80 || true
      - name: Install tools
        run: brew install just
      - name: Placeholder secrets (fork-safe)
        run: |
          cp SmartTubeApp/Config/Secrets.xcconfig.example SmartTubeApp/Config/Secrets.xcconfig
          # Firebase Crashlytics + CopyPlistFile require this path. The example
          # is placeholder-only (YOUR_FIREBASE_*) and is gitignored once copied.
          cp SmartTubeApp/SmartTubeApp/GoogleService-Info.plist.example \
            SmartTubeApp/SmartTubeApp/GoogleService-Info.plist
          mkdir -p "SmartTubeApp/Smart Tube"
          cp SmartTubeApp/SmartTubeApp/GoogleService-Info.plist.example \
            "SmartTubeApp/Smart Tube/GoogleService-Info.plist"
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            SmartTubeIOS/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-compile-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build iOS Simulator
        run: just build-ios-ci
      - name: Build tvOS Simulator
        run: just build-tvos-ci
